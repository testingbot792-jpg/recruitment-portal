<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Recruitment Portal</a>
  </div>
</nav>

<!-- MAIN SECTION -->
<div class="container mt-5">
  <div class="row">

    <!-- LEFT SIDE (About) -->
    <div class="col-md-6">
      <h2>Welcome to Recruitment Portal</h2>
      <p class="text-muted">
        Find your dream job or hire the best talent easily.
      </p>

      <ul>
        <li>✔ Easy job posting</li>
        <li>✔ Apply in one click</li>
        <li>✔ Secure authentication</li>
      </ul>

      <a href="/signup/" class="btn btn-outline-primary mt-3">Create Account</a>
    </div>

    <!-- RIGHT SIDE (Login) -->
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h4 class="text-center mb-4">Login</h4>

          <!-- ERROR MESSAGE -->
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <input type="email" name="email" class="form-control" placeholder="Email" required>
            </div>

            <div class="mb-3">
              <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button class="btn btn-primary w-100">Login</button>
          </form>

          <p class="text-center mt-3">
            Don't have an account? <a href="/signup/">Signup</a>
          </p>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
