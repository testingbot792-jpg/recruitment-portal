{% extends 'base.html' %}

{% block content %}

<h2 class="text-2xl font-bold mb-4">👥 Candidates</h2>
<div class="mt-3 flex gap-2">

  {% if user.resume %}
    <a href="/resume/{{ user.id }}/" target="_blank"
       class="bg-blue-500 text-white px-3 py-1 rounded">
      View
    </a>
  {% else %}
    <span class="text-red-500">No Resume</span>
  {% endif %}

</div>
<div class="grid md:grid-cols-3 gap-4">

  {% for user in candidates %}
  <div class="bg-white p-4 shadow rounded">

    <h4 class="font-bold text-lg">{{ user.email }}</h4>
    <p class="text-gray-500">Role: {{ user.role }}</p>

    {% if user.resume %}
        <a href="/resume/{{ user.id }}/" target="_blank"
        class="bg-blue-500 text-white px-3 py-1 rounded">
        📄 View Resume
        </a>
    {% else %}
      <p class="text-red-500 mt-2">No Resume Uploaded</p>
    {% endif %}

  </div>
  {% endfor %}

</div>

{% endblock %}
